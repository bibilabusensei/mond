name: patch diagnostics labels

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch localized labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'mond/views/ContentView.swift': [
                  ('Text("Detected Retail Model Base")', 'Text(L("Detected Retail Model Base"))'),
              ],
              'mond/views/SettingsView.swift': [
                  ('Label("Apple Intelligence Diagnostics", systemImage: "brain.head.profile")', 'Label(L("Apple Intelligence Diagnostics"), systemImage: "brain.head.profile")'),
                  ('Label("Diagnostics", systemImage: "stethoscope")', 'Label(L("Diagnostics"), systemImage: "stethoscope")'),
                  ('Text("Read MobileGestalt identity values and attempt a read-only inspection of eligibilityd to locate the remaining Apple Intelligence eligibility failure.")', 'Text(L("Read MobileGestalt identity values and attempt a read-only inspection of eligibilityd to locate the remaining Apple Intelligence eligibility failure."))'),
              ],
              'mond/views/AppleIntelligenceDiagnosticsView.swift': [
                  ('Label("System Environment", systemImage: "iphone")', 'Label(L("System Environment"), systemImage: "iphone")'),
                  ('Text("This page is read-only. The device language shown here is the app/system preferred language; Siri language is evaluated separately by iOS and may only appear inside eligibilityd data when that file is readable.")', 'Text(L("This page is read-only. The device language shown here is the app/system preferred language; Siri language is evaluated separately by iOS and may only appear inside eligibilityd data when that file is readable."))'),
                  ('Label("MobileGestalt Identity", systemImage: "checklist")', 'Label(L("MobileGestalt Identity"), systemImage: "checklist")'),
                  ('Label("Apple Intelligence Eligibility", systemImage: "brain.head.profile")', 'Label(L("Apple Intelligence Eligibility"), systemImage: "brain.head.profile")'),
                  ('Text("Mond only attempts to read eligibilityd here. It does not modify eligibility.plist. If access is denied, that result is useful: the current MobileGestalt sandbox token does not grant access to eligibilityd and a different read path would be required before deeper diagnosis.")', 'Text(L("Mond only attempts to read eligibilityd here. It does not modify eligibility.plist. If access is denied, that result is useful: the current MobileGestalt sandbox token does not grant access to eligibilityd and a different read path would be required before deeper diagnosis."))'),
                  ('Label("Refresh Diagnostics", systemImage: "arrow.clockwise")', 'Label(L("Refresh Diagnostics"), systemImage: "arrow.clockwise")'),
                  ('.navigationTitle("AI Diagnostics")', '.navigationTitle(L("AI Diagnostics"))'),
              ],
          }

          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              before = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text)
                  changed = True
                  print('Patched', filename)
              else:
                  print('No changes needed', filename)

          print('changed=', changed)
          PY

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mond/views/ContentView.swift mond/views/SettingsView.swift mond/views/AppleIntelligenceDiagnosticsView.swift
          git commit -m "Localize AI diagnostics labels"
          git push
